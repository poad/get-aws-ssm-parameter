name: Rebuild dist (Dependabot)
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.actor == 'dependabot[bot]'
        with:
          ref: ${{ github.head_ref }}
          # CI を再実行させたい場合は PAT / GitHub App トークン（Dependabot secrets に登録）
          token: ${{ secrets.DIST_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        if: github.actor == 'dependabot[bot]'
        with:
          install: false

      - name: Install dependencies
        if: github.actor == 'dependabot[bot]'
        run: pnpm install --no-frozen-lockfile

      - name: Commit dist
        if: github.actor == 'dependabot[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || { git commit -m "chore: rebuild dist"; git push; }

      - if: github.actor != 'dependabot[bot]'
        run: echo "Skipped rebuild"
