packages:
  - .
  - __tests__/cdk

allowBuilds:
  '@swc/core': false
  esbuild: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.23.0

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
